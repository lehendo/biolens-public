[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biolens"
version = "0.1.0"
description = "SAE interpretability toolkit for biological foundation models"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Arjun Chatterjee", email = "arj0jeechat@gmail.com"}]
keywords = ["mechanistic interpretability", "biology", "sparse autoencoders", "protein language models", "genomics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "torch==2.11.0",   # Pinned to an exact version+build, not a floor. Plain PyPI
                       # serves a +cu130 build under this same version string; the
                       # +cu128 build this project is validated against must come
                       # from PyTorch's own CUDA index (see README Installation).
    "transformers>=4.57.6,<5.0.0",  # Upper bound required by the optional
                       # borzoi-pytorch extra, which itself pins transformers<5.0.0.
    "datasets>=2.18",
    "tokenizers>=0.19",
    "h5py>=3.10",
    "numpy>=1.26",     # cyvcf2>=0.31 requires numpy>=2.0; torch>=2.3 is required
                       # for ABI compatibility with numpy 2.x.
    "scipy>=1.12",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
    "wandb>=0.16",
    "gradio>=4.20",
    "pyyaml>=6.0",
    "filelock>=3.13",
    "tqdm>=4.66",
    "einops>=0.7",
    "requests>=2.31",
    "huggingface-hub>=0.22",
    "anthropic>=0.40",
    "pyBigWig>=0.3.22",
    "pyfaidx>=0.8",
    "cyvcf2>=0.31",
    "sae-lens>=4.0",   # Pretrained SAE loading for Gemma Scope
                       # (biolens.models.gemma_scope); pulls in transformer_lens.
    "pyliftover>=0.4", # GRCh37->GRCh38 coordinate conversion for cross-build
                       # genomic analyses (biolens.data.reference_genome).
    "evo2==0.6.0",     # Evo 2 model package (biolens.models.evo2). Transitively
                       # requires biopython and vtx>=1.1.0 (Arc Institute's
                       # Vortex/StripedHyena2 framework).
    "flash-attn==2.8.3.post1",  # Required at runtime by vtx (Evo 2's dependency),
                       # which imports flash_attn_2_cuda directly. The prebuilt
                       # PyPI wheel is compiled against a different torch C++ ABI
                       # and fails at import time, not install time, with
                       # `undefined symbol: ...materialize_cow_storage...`. Build
                       # from source against the already-installed torch instead:
                       #     pip install flash-attn==2.8.3.post1 \
                       #         --no-build-isolation --no-binary flash-attn \
                       #         --no-cache-dir --force-reinstall --no-deps
                       # This is a real from-source CUDA kernel compile: budget
                       # significant time and memory, and run it on a GPU node
                       # with a matching CUDA toolkit available, not a login node.
]

[project.optional-dependencies]
borzoi = [
    "borzoi-pytorch>=0.5",  # Optional: conflicts with sae-lens's transformer_lens
                       # dependency on the transformers upper bound above, so it's
                       # kept opt-in. --skip-borzoi at the CLI level covers running
                       # without this extra installed.
]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
    "types-PyYAML",
    "types-requests",
    "types-tqdm",
]

[project.scripts]
biolens-extract = "biolens.scripts.extract_activations:main"
biolens-train = "biolens.scripts.train_sae:main"
biolens-eval = "biolens.scripts.run_eval:main"
biolens-dashboard = "biolens.dashboard.app:main"

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = [
    "E501",
    "N812",  # e.g. `import torch.nn.functional as F`, standard PyTorch convention
    "N806",  # e.g. `N, D = x.shape`, standard ML shape-variable notation
]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_ignores = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: marks tests that require network access or real model weights (deselect with -m 'not integration')",
    "slow: marks tests that take more than 10 seconds",
]
addopts = "-v --tb=short"
