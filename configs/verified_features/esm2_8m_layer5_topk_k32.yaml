  # ── Round 8 (2026-07-22): first round against the 100K-eval-scale sweep
  # (sweep_esm2_8m_L5_k32_x8_100k), not the 10K sweep rounds 1-7 used. A
  # carryover check (fit_sweep.py against the 100K sweep using the registry
  # as of round 7, 82 entries) found only 7 of those 82 land on an actual
  # top-hit (feature_idx, go_id) pair in the 100K sweep — confirming this is
  # effectively a fresh registry-growth process, not a continuation of the
  # same fitted sample. 58 fresh candidates pulled via
  # select_fresh_candidates.py (--n-per-mp 30) across mp10/mp20/mp100 (mp50/
  # 150/200/300 had none — likely already claimed by the 7 carryover hits or
  # genuinely exhausted at this scale). Note: mp10 and mp20 are NOT two
  # independent evidence thresholds here — probing.py's max_go_terms=500 cap
  # means both test the identical top-500-by-positive-count GO terms at 100K
  # scale, so mp20's "fresh" candidates are simply the next-AUROC-tier
  # continuation of mp10's own ranked list (confirmed: mp10 ends at
  # auroc=0.950, mp20 begins at 0.946, zero feature-index overlap). Result:
  # 10 confirmed, 5 plausible, 43 spurious — a 17%/9%/74% split, the largest
  # single batch checked this project and consistent with (if anything
  # slightly better than) the historical rate of naive AUROC-based
  # candidates failing real verification. Two features (2327, 2440) each
  # carried 15-20 simultaneously-claimed GO terms at high AUROC; neither
  # feature's real identity matched ANY of its claims (an Arabidopsis PH-
  # domain/PtdIns3P-binding protein and a 15-residue tobacco cell-wall
  # fragment, respectively) — a promiscuous multi-GO-claim pattern itself
  # reads as a red flag for a generic/confounded feature rather than a
  # genuine multi-concept detector, worth noting as a qualitative finding.

