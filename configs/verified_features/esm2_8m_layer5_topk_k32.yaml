# Verified/debunked SAE feature -> GO-term claims.
#
# GO probing (biolens.eval.probing) computes single-feature AUROC automatically —
# a high AUROC is a CANDIDATE for "this feature encodes this concept," not proof.
# Every entry below was checked by pulling the feature's real top-activating
# sequences (scripts/inspect_features.py) and cross-referencing their actual
# UniProt annotations. Of the original 29 features checked across three
# verification rounds (despite all having high single-feature AUROC), 6 were
# confirmed correct, 6 were plausible but not fully confirmed, 16 were outright
# spurious, and 1 was unverifiable (target protein has no GO annotations to
# check against at all).
#
# Round 4 (2026-07-14): expansion toward the pre-specified n_clusters=100
# target — 18 more features drawn from mp10/mp20/mp50/mp100 of the confirmatory sweep
# (sweep_esm2_8m_L5_k32_x8), not the earlier ad hoc eval runs rounds 1-3 used.
# Result: 2 confirmed, 4 plausible, 10 spurious, 2 unverifiable. Notable:
# feature 1835 (CorC, confirmed CBS domains) and feature 1256 (Ephrin
# receptor, generic kinase catalytic motif) are two MORE instances of the
# recurring false-AMPK confound already found at every other scale (35M,
# 150M, 650M) — the same structural-domain-present-but-wrong-protein pattern
# keeps recurring across all four model sizes independently.
#
# Round 5 (2026-07-14): 15 more features, all remaining fresh candidates from
# mp10 (mp20/50/100/150/200/300 pools were exhausted of unchecked candidates
# by round 4). Result: 2 confirmed, 3 plausible, 10 spurious. Two more real
# positive controls this round: feature 320 (4-coumarate-CoA ligase, exact
# GO:0016207 match) and feature 2533 (an actual CO-dehydrogenase/acetyl-CoA-
# synthase complex subunit, exact match for the claimed anaerobic CODH
# activity). Also two more instances of established confound patterns:
# feature 1298 (bitter taste receptor T2R13 misclassified as a serotonin
# receptor — same GPCR-subfamily-cross-confusion pattern as the olfactory-
# receptor-as-serotonin/cholinergic-receptor confounds found earlier) and
# feature 315 (Tie-1 receptor tyrosine kinase misclassified as a
# serine/threonine kinase — a Tyr-vs-Ser/Thr variant of the same generic-
# kinase-catalytic-domain confound already seen via Ephrin receptor and
# CBS-domain proteins at other scales).
#
# Round 6 (2026-07-14): 15 more features, all from mp10 (mp20/50/100/150/
# 200/300 are now fully exhausted of unchecked candidates — every remaining
# fresh candidate for esm2_8m draws from mp10 only, going forward a
# different eval slice or --max-eval-seqs setting will be needed to keep
# expanding this registry). Result: 2 confirmed, 0 plausible, 13 spurious —
# the lowest plausible rate of any round so far, though still 2 more real
# positive controls: feature 1775 (MsbA, an ABC-transporter with GO:0016887
# "ATP hydrolysis activity" documented as an exact match) and feature 244
# (tropomyosin family — actin filament GO term directly confirmed; notably
# the single AUROC-linked top-1 hit was an uncharacterized Mycoplasma
# protein with no GO terms at all, but 9 of the other top-10 hits were
# unambiguous tropomyosin, so the majority-pattern evidence was used rather
# than defaulting to "unverifiable" based on the single top-ranked hit —
# see also feature 186 this round, where the same majority-pattern
# reasoning was applied in the opposite direction: an uncharacterized viral
# top-1 hit, but a clear antimicrobial-peptide identity in the rest of the
# top-10, contradicting rather than supporting the claimed GO term).
#
# Round 7 (2026-07-14): FINAL round for this sweep — only 5 fresh candidates
# remained in mp10 (confirmed via select_fresh_candidates.py with a raised
# --n-per-mp=40 cap, not truncated by the cap this time), and every other
# min_positives value was already fully exhausted by round 6.
# sweep_esm2_8m_L5_k32_x8 has no more distinct best_feature_idx values left
# to draw from at all. Result: 0 confirmed, 0 plausible, 4 spurious, 1
# unverifiable — the weakest batch of any round, consistent with the
# highest-AUROC / easiest-to-confirm candidates being exhausted first in
# earlier rounds. esm2_8m's registry is now at its natural ceiling for this
# sweep (82 entries checked; growing further requires a new eval slice,
# e.g. a larger --max-eval-seqs sweep, not just more rounds against this
# one).
#
# status values:
#   confirmed    — real top-activating sequences match the claimed GO term/concept
#   spurious     — real top-activating sequences are an unrelated protein family;
#                  the claimed GO term is wrong for this feature
#   plausible    — consistent with the claimed concept but not fully confirmed
#                  (e.g. exact GO term not re-verified in the fetched record)
#   unverifiable — the target protein has no GO annotations at all to check
#                  against; the feature may be tracking something real that
#                  simply hasn't been characterized yet
#
# Scoped per (model, layer, SAE variant, k) — feature indices are meaningless
# without a specific trained SAE; do not reuse this file for a different
# checkpoint even of the same architecture (a retrained SAE will assign
# different concepts to different feature indices).

