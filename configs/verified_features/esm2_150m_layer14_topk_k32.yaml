# Verified/debunked SAE feature -> GO-term claims.
#
# GO probing (biolens.eval.probing) computes single-feature AUROC automatically —
# a high AUROC is a CANDIDATE for "this feature encodes this concept," not proof.
# Every entry below was checked by pulling the feature's real top-activating
# sequences (scripts/inspect_features.py) and cross-referencing their actual
# UniProt annotations (via the public UniProt REST API, not memory).
# See the module docstring in biolens.eval.probing for methodology details.
#
# Applying the lesson learned building esm2_35m's registry: candidates were
# drawn from TWO different min_positives values from the start (10 and 50),
# not just one — a registry built entirely from a single sweep point has
# near-zero variance in the confirmatory model's own predictor and produces
# a degenerate fit (see esm2_35m's registry file for the full incident).
#
# Round 1 (2026-07-14): 18 features checked — 10 from min_positives=10,
# 8 from min_positives=50 — 1 confirmed, 2 plausible, 15 spurious, 0
# unverifiable. Notably harsher than esm2_8m (21%/21%/55%/3%) or esm2_35m
# (23%/18%/55%/5%) — worth flagging as a real, if preliminary (n=18),
# cross-scale observation, not yet enough data to call it a trend.
#
# Notable finding this round: two features (4641, 1304) each had
# AUROC > 0.99 across 9-13 DIFFERENT correlated GO terms simultaneously
# (acetylcholine receptor family terms; serotonin/synapse/ERK terms,
# respectively) — looked like unusually strong, mutually-reinforcing
# evidence before checking. Both turned out to be olfactory receptors, not
# the claimed receptor families. High multi-term AUROC correlation is NOT
# extra evidence of correctness — it's the same right-superfamily/
# wrong-specific-ligand confound recurring across many correlated terms at
# once, worth naming explicitly as its own caution.
#
# NOTE: feature indices in this file are scoped to esm2_150m's OWN trained
# SAE (d_sae=5120, k=32) and are NOT comparable to esm2_8m's or esm2_35m's
# registries — feature indices are meaningless across differently-trained
# SAEs (2026-07-14 scope-correction note).
#
# status values:
#   confirmed    — real top-activating sequences match the claimed GO term/concept
#   spurious     — real top-activating sequences are an unrelated protein family;
#                  the claimed GO term is wrong for this feature
#   plausible    — consistent with the claimed concept but not fully confirmed
#                  (e.g. right general functional class but wrong specific
#                  pathway/substrate, or one of several claimed terms confirmed
#                  and others not)
#   unverifiable — the target protein has no GO annotations at all to check
#                  against; the feature may be tracking something real that
#                  simply hasn't been characterized yet
#
# Scoped per (model, layer, SAE variant, k) — feature indices are meaningless
# without a specific trained SAE; do not reuse this file for a different
# checkpoint even of the same architecture (a retrained SAE will assign
# different concepts to different feature indices).

