# Verified/debunked SAE feature -> GO-term claims.
#
# GO probing (biolens.eval.probing) computes single-feature AUROC automatically —
# a high AUROC is a CANDIDATE for "this feature encodes this concept," not proof.
# Every entry below was checked by pulling the feature's real top-activating
# sequences (scripts/inspect_features.py) and cross-referencing their actual
# UniProt annotations (via the public UniProt REST API, not memory).
#
# Round 1 (2026-07-14): 15 features checked, all with single_feature_auroc=1.000
# at min_positives=10 (the largest, most complete sweep point for this model) —
# 3 confirmed, 3 plausible, 8 spurious, 1 unverifiable. Nearly identical ratio
# to esm2_8m's registry (6/6/16/1 of 29, ~21%/21%/55%/3%) — a cross-model
# consistency check that the small-sample winner's-curse artifact isn't
# 8M-specific.
#
# IMPORTANT lesson from round 1: fit_sweep.py degenerated (slope=-28.6,
# SE=NaN) when fit against round-1-only data, because every round-1 candidate
# was drawn from min_positives=10 alone (one exception at 20) — near-zero
# variance in the model's own predictor, not a real effect, not fixable by
# more features at the same min_positives value. Round 2 deliberately drew
# candidates from min_positives=50 instead, mirroring esm2_8m's own
# multi-round-across-different-mp construction.
#
# Round 2 (2026-07-14, min_positives=50, sweep_esm2_35m_L5_k32_x8/mp50):
# 7 features checked — 2 confirmed, 1 plausible, 4 spurious. **New failure
# mode found and documented here, not seen at min_positives=10**: 3 of the 4
# spurious cases (2766, 2081, 1713) share one mechanism — very short peptide
# fragments (8-30 residues, several explicitly Swiss-Prot "Flags: Fragment"
# entries) combined with extremely high activation rates (34-46%, the
# broadest of any feature checked all session). These features are most
# plausibly detecting "this is an unusually short sequence" as an ESM2
# mean-pooled-embedding artifact, not any real biological concept — a
# distinct category from "right class wrong specificity" or "broad/
# promiscuous feature," worth its own name: short-fragment embedding
# artifact.
#
# NOTE: feature indices in this file are scoped to esm2_35m's OWN trained SAE
# (d_sae=3840, k=32) and are NOT comparable to esm2_8m's registry — confirmed
# directly by trying to join esm2_8m's registry against this model's sweep
# results via fit_sweep.py, which correctly found zero matches.
#
# Round 3 (2026-07-16): 38 features checked — 20 from mp10, 18 from mp20
# (mp50/100/150/200/300 already exhausted by round 2), drawn via the new
# scripts/select_fresh_candidates.py (replacing ad hoc one-off pulls). Result:
# 4 confirmed, 6 plausible, 2 unverifiable, 26 spurious — the best confirmed
# count of any round for this model. Notable: feature 2849's claimed 9
# correlated acetylcholine-receptor-family GO terms initially looked spurious
# (top-1 hit was an archaeal cation transporter, Q57891/MJ0449), but checking
# a second top-activating accession (P43679, a real chicken neuronal nAChR
# subunit CHRNB3) confirmed the majority of the top-10 genuinely are
# nicotinic acetylcholine receptor subunits — the same majority-pattern
# verification approach already used for esm2_8m features 186/244, now
# applied here with the opposite outcome (confirming rather than debunking).
# Also two independent instances of the PrsW intramembrane-protease family
# (features 794 and 3640, different bacterial species) both being
# misclassified — once as 5'-nucleotidase, once as neuronal cell body —
# confirming this feature is tracking the PrsW fold specifically, not either
# claimed concept.
#
# Round 4 (2026-07-16): FINAL round for this sweep — 26 fresh candidates, all
# from mp10 (mp20 fully exhausted by round 3; every other min_positives value
# already exhausted by round 2). select_fresh_candidates.py confirmed no
# candidates remain at any sweep point after this round. Result: 4 confirmed,
# 3 plausible, 19 spurious, 0 unverifiable. Two exact, clean confirmations:
# feature 1573 (a real snake-venom C-type lectin toxin, GO:0090729 "toxin
# activity" explicitly documented) and feature 1825 (6-phosphogluconolactonase,
# an exact match for "pentose-phosphate shunt" — literally step 2 of the
# oxidative PPP). Feature 2370 confirmed a GABA-A receptor subunit against the
# claimed "neuron projection" term (axon/dendrite are both documented GO
# cellular components for this protein, subtypes of neuron projection).
# esm2_35m's registry is now at its natural ceiling for this sweep (98 entries
# checked; growing further requires a new eval slice, same conclusion reached
# for esm2_8m).
#
# status values:
#   confirmed    — real top-activating sequences match the claimed GO term/concept
#   spurious     — real top-activating sequences are an unrelated protein family;
#                  the claimed GO term is wrong for this feature
#   plausible    — consistent with the claimed concept but not fully confirmed
#                  (e.g. exact GO term not re-verified in the fetched record, or
#                  right general enzyme/domain family but wrong specific substrate)
#   unverifiable — the target protein has no GO annotations at all to check
#                  against; the feature may be tracking something real that
#                  simply hasn't been characterized yet
#
# Scoped per (model, layer, SAE variant, k) — feature indices are meaningless
# without a specific trained SAE; do not reuse this file for a different
# checkpoint even of the same architecture (a retrained SAE will assign
# different concepts to different feature indices).

