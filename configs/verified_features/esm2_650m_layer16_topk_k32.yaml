# Verified/debunked SAE feature -> GO-term claims.
#
# GO probing (biolens.eval.probing) computes single-feature AUROC automatically —
# a high AUROC is a CANDIDATE for "this feature encodes this concept," not proof.
# Every entry below was checked by pulling the feature's real top-activating
# sequences (scripts/inspect_features.py) and cross-referencing their actual
# UniProt annotations (via the public UniProt REST API, not memory).
# See the module docstring in biolens.eval.probing for methodology details.
#
# Candidates drawn from two min_positives values (10 and 50) from the start,
# per the lesson learned building esm2_35m's registry — see that file for
# the full incident (a single-sweep-point registry produces a degenerate
# confirmatory fit, near-zero predictor variance, not a real effect).
#
# NOTE on tooling: the initial inspect_features.py call for this registry
# OOM-killed on the login node (d_sae=10240, full 557K-vector cache scan) —
# fixed 2026-07-14 by adding an optional feature_indices= parameter to
# load_cache_features() that discards unwanted SAE feature columns
# immediately after each shard's encode() call instead of materializing the
# full (N, d_sae) matrix (see src/biolens/eval/feature_inspection.py). Same
# class of memory bug as the ActivationCache.finalize() OOM fixed earlier
# (2026-07-04), just in a different, previously-untouched function.
#
# Round 1 (2026-07-14): 18 features checked — 10 from min_positives=10,
# 8 from min_positives=50 — 1 confirmed, 7 plausible, 9 spurious,
# 1 unverifiable. Notably higher plausible rate (39%) than esm2_150m's
# first batch (11%) despite a similarly low confirmed rate (6% both) —
# worth flagging as a real, if preliminary (n=18), cross-scale observation:
# 650M's larger capacity may produce more "right general class, imprecise
# specific claim" features rather than 150M's more common "completely
# unrelated" pattern, but this is not yet a confirmed trend at this sample
# size.
#
# Notable finding this round: feature 5627 is a clean, DIRECT confirmed
# match for "AMP-activated protein kinase complex" — KING1, the actual
# plant SNF1/AMPK regulatory gamma-subunit ortholog — genuinely part of the
# real AMPK-family complex, not a structurally-similar CBS-domain decoy
# like the false AMPK claims seen at every other scale checked so far
# (esm2_8m feature 454, esm2_35m feature 454-equivalent, esm2_150m feature
# 1382 via hemolysin's CBS domains). Worth noting as a
# genuine positive control that the verification process isn't just finding
# spurious results everywhere — real, well-supported claims do occur and
# are correctly distinguished from the confounds.
#
# NOTE: feature indices in this file are scoped to esm2_650m's OWN trained
# SAE (d_sae=10240, k=32) and are NOT comparable to any other model's
# registry — feature indices are meaningless across differently-trained
# SAEs (2026-07-14 scope-correction note).
#
# status values:
#   confirmed    — real top-activating sequences match the claimed GO term/concept
#   spurious     — real top-activating sequences are an unrelated protein family;
#                  the claimed GO term is wrong for this feature
#   plausible    — consistent with the claimed concept but not fully confirmed
#                  (e.g. right general functional class but wrong specific
#                  pathway/substrate, or one of several claimed terms confirmed
#                  and others not)
#   unverifiable — the target protein has no GO annotations at all to check
#                  against; the feature may be tracking something real that
#                  simply hasn't been characterized yet
#
# Scoped per (model, layer, SAE variant, k) — feature indices are meaningless
# without a specific trained SAE; do not reuse this file for a different
# checkpoint even of the same architecture (a retrained SAE will assign
# different concepts to different feature indices).

model: esm2_650m
layer: 16
sae_variant: topk
k: 32

