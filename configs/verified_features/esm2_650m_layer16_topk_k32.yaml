  # ── Round 2 (2026-07-22/23): first substantial registry growth against the
  # 100K-eval-scale sweep (sweep_esm2_650m_L16_k32_x8_100k), not the 10K sweep
  # round 1 used. This is 650M's first real growth round — round 1 was only
  # 18 entries total. 82 fresh candidates pulled via select_fresh_candidates.py
  # (--n-per-mp 30) — the largest single round8 batch across all four models
  # this session. Result: 13 confirmed, 8 plausible, 61 spurious, 0
  # unverifiable — a 16%/10%/74% split, closely matching esm2_8m's Round 8
  # (17%/9%/74%) and esm2_35m's Round 5 (18%/8%/74%), and notably higher than
  # esm2_150m's Round 2 (9%/9%/83%) — supporting the interpretation that
  # 150m's lower rate was batch-to-batch noise (n=70) rather than a genuine
  # per-model difference, since the largest model reverts to the same ~17%
  # baseline. Multiple confirmed features this round were literally the same
  # real proteins already confirmed in other models' registries this session
  # (soybean/Arabidopsis cyclins, AKR-family oxidoreductases, CXC/CC
  # chemokines, aquaporins) — the same small set of real, distinct concepts
  # keeps getting independently rediscovered across model scales, which is
  # itself a useful cross-model consistency check.
