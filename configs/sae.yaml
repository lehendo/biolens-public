# SAE training configurations.
# All variants share the same training infrastructure; only hyperparameters differ.
# Reference implementations:
#   TopK   — Gao et al. (2024), EleutherAI sparsify
#   JumpReLU — Lieberum et al. (2024), Gemma Scope; SAELens (Joseph Bloom)
#   Gated  — Rajamanoharan et al. (2024); SAELens

# ── Phase 0 ── TopK ──────────────────────────────────────────────────────
topk:
  variant: topk
  # Architecture
  expansion_factor: 8       # d_sae = expansion_factor * d_model
  k: 32                     # number of active features per token
  # Training
  n_steps: 10000            # total optimizer steps
  batch_size: 4096          # activation vectors per step
  lr: 2.0e-4
  lr_warmup_steps: 500
  lr_decay_start_fraction: 0.8   # cosine decay begins at this fraction of training
  grad_clip: 1.0
  # Dead feature handling
  ema_decay: 0.99           # for tracking per-feature activation frequency
  dead_threshold: 1.0e-4   # EMA rate below which a feature is "dead"
  aux_fraction: 1.0e-3      # weight of auxiliary dead-feature loss
  k_aux_factor: 4           # k_aux = d_sae // k_aux_factor (features used in aux recon)
  # Normalization
  normalize_activations: true    # subtract mean, divide by mean norm before training
  # Checkpointing
  save_every: 2000          # save checkpoint every N steps
  eval_every: 500           # run eval metrics every N steps

# ── Phase 1 ── JumpReLU ──────────────────────────────────────────────────
jumprelu:
  variant: jumprelu
  expansion_factor: 8
  target_l0: 32             # target number of active features (controls sparsity)
  bandwidth: 0.001          # STE bandwidth for threshold gradient
  n_steps: 10000
  batch_size: 4096
  lr: 2.0e-4
  lr_warmup_steps: 500
  lr_decay_start_fraction: 0.8
  grad_clip: 1.0
  normalize_activations: true
  save_every: 2000
  eval_every: 500

# ── Phase 1 ── Gated ─────────────────────────────────────────────────────
gated:
  variant: gated
  expansion_factor: 8
  sparsity_coeff: 2.0e-3    # L1 coefficient on gate activations
  n_steps: 10000
  batch_size: 4096
  lr: 2.0e-4
  lr_warmup_steps: 500
  lr_decay_start_fraction: 0.8
  grad_clip: 1.0
  normalize_activations: true
  save_every: 2000
  eval_every: 500
